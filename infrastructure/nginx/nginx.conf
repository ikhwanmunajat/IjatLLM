events {
  worker_connections 1024;
}

http {
  upstream web {
    server web:3000;
  }

  upstream app_api {
    server app-api:8000;
  }

  upstream litellm {
    server litellm:4000;
  }

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Host $host;

  # Website utama
  server {
    listen 80;
    server_name ijatllm.my.id www.ijatllm.my.id;

    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/app/ {
      proxy_pass http://app_api/;
      proxy_set_header X-Request-ID $request_id;
    }

    location / {
      proxy_pass http://web;
    }
  }

  # Portal informasi
  server {
    listen 80;
    server_name platform.ijatllm.my.id;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
      return 302 https://platform.ijatllm.my.id/info;
    }

    location /api/app/ {
      proxy_pass http://app_api/;
      proxy_set_header X-Request-ID $request_id;
    }

    location / {
      proxy_pass http://web;
    }
  }

  # Login pengguna
  server {
    listen 80;
    server_name app.ijatllm.my.id;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
      return 302 https://lite.ijatllm.my.id/ui/login/?source=app;
    }
  }

  # Dokumentasi
  server {
    listen 80;
    server_name docs.ijatllm.my.id;

    location = / {
      return 302 https://docs.ijatllm.my.id/docs;
    }

    location / {
      proxy_pass http://web;
    }
  }

  # Status layanan
  server {
    listen 80;
    server_name status.ijatllm.my.id;

    location = / {
      return 302 https://status.ijatllm.my.id/status;
    }

    location / {
      proxy_pass http://web;
    }
  }

  # Admin
  server {
    listen 80;
    server_name admin.ijatllm.my.id;

    location / {
      return 302 https://lite.ijatllm.my.id/ui/;
    }
  }

  # API publik
  server {
    listen 80;
    server_name api.ijatllm.my.id;

    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;

    location /v1/ {
      limit_req zone=api_limit burst=60 nodelay;
      proxy_pass http://litellm;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_set_header X-Request-ID $request_id;
    }

    location = /health {
      proxy_pass http://litellm/health/liveliness;
    }

    location = /health/liveliness {
      proxy_pass http://litellm/health/liveliness;
    }

    location = /health/readiness {
      proxy_pass http://litellm/health/readiness;
    }

    location / {
      return 404;
    }
  }

  # Dashboard LiteLLM
  server {
    listen 80;
    server_name gateway.ijatllm.my.id lite.ijatllm.my.id;

    client_max_body_size 25m;

    location = / {
      return 302 https://$host/ui/;
    }

    location = /ui {
      return 302 https://$host/ui/;
    }

    location / {
      proxy_pass http://litellm;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-ID $request_id;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_read_timeout 300s;
      proxy_buffering off;
    }
  }

  # Domain tidak dikenal
  server {
    listen 80 default_server;
    server_name _;
    return 404;
  }
}