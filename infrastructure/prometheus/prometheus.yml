global:
  scrape_interval: 15s

scrape_configs:
  - job_name: litellm
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/litellm-master-key
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: app-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app-api:8000"]